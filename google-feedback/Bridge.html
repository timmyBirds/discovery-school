<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Feedback connection</title></head>
<body>
<script>
  const allowedOrigin = <?!= JSON.stringify(allowedOrigin) ?>;
  const source = 'discovery-review-bridge';
  window.addEventListener('message', event => {
    const data = event.data;
    if (event.origin !== allowedOrigin || event.source !== window.top ||
        !data || data.source !== 'discovery-review-page' ||
        !/^[0-9a-f-]{36}$/i.test(data.requestId || '')) return;
    const requestId = data.requestId;
    const runner = google.script.run
      .withSuccessHandler(result => window.top.postMessage(
        { source, type: 'result', requestId, ok: true, result }, allowedOrigin))
      .withFailureHandler(error => window.top.postMessage(
        { source, type: 'result', requestId, ok: false,
          error: (error && error.message) || 'Google Sheets could not save this feedback.' }, allowedOrigin))
    if (data.type === 'submit') runner.submitFeedback(data.feedback);
    else if (data.type === 'content-list') runner.publishedContent();
    else if (data.type === 'content-publish') runner.publishContent(data.edit);
  });
  window.top.postMessage({ source, type: 'ready' }, allowedOrigin);
</script>
</body>
</html>
